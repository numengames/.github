#
# Reusable: the full-history secret scan (STD-015 SEC-004, STD-022 KEY-054).
# No secret in the tree or in any commit of its history. Red means a commit
# carries something that looks like a key; the log names the rule, the file
# and the commit, with the value redacted.
#
# If it is a real secret: rotate it at its issuer first, then remove it
# (PRO-036). Deleting it from the tree does not take it out of history.
# If it is not a secret: add an allowance to the CALLING repository's
# .gitleaks.toml that matches only the value, with a reason; never allow a
# whole path. The scan uses that file when it exists, and gitleaks' default
# rules when it does not.
#
# The scanner is the gitleaks release binary, verified against the checksum
# file its release publishes: no third-party action, no licence key.
#
# Call it from a repository with:
#   jobs:
#     scan:
#       uses: numengames/.github/.github/workflows/secrets.yml@<commit-sha>
#       permissions:
#         contents: read
name: secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history: a secret removed from the tree is still in
          # the commit that added it.
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version

      - name: scan every commit
        run: |
          if [ -f .gitleaks.toml ]; then
            echo "using this repository's .gitleaks.toml"
            ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          else
            echo "no .gitleaks.toml: default rules"
            ./gitleaks git --redact --no-banner --exit-code 1 .
          fi
