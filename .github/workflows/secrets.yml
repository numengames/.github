#
# Reusable: the secret scan, by level (STD-015 SEC-004, STD-022 KEY-054).
# No secret in the tree or in any commit of its history: a pull request is checked on the
# commits it adds, the default branch on its whole history, the weekly run on every ref. Red means a commit
# carries something that looks like a key; the log names the rule, the file
# and the commit, with the value redacted.
#
# If it is a real secret: rotate it at its issuer first, then remove it
# (PRO-036). Deleting it from the tree does not take it out of history.
# If it is not a secret: add an allowance to the CALLING repository's
# .gitleaks.toml that matches only the value, with a reason; never allow a
# whole path. The scan uses that file when it exists, and gitleaks' default
# rules when it does not.
#
# The scanner is the gitleaks release binary, verified against the checksum
# file its release publishes: no third-party action, no licence key.
#
# Call it from a repository with:
#   jobs:
#     scan:
#       uses: numengames/.github/.github/workflows/secrets.yml@<commit-sha>
#       permissions:
#         contents: read
name: secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history: a secret removed from the tree is still in
          # the commit that added it.
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version

      # Three levels, so a false alarm on one branch cannot stop every other pull request:
      #   pull request / merge queue -> the commits this change adds (base..HEAD). Blocks.
      #   push to the default branch -> the whole history reachable from it. Blocks nothing
      #                                  else, but a leak merged by hand shows up red there.
      #   weekly schedule / manual   -> every ref of the repository, branches included
      #                                  (gitleaks' default). Reports; blocks no pull request.
      # fetch-depth 0 puts every remote branch into the clone, which is why one scan of
      # "everything" used to read other people's branches into each pull request.
      - name: choose what to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request|pull_request_target) range="${PR_BASE}..HEAD"; level="pull request: only the commits it adds" ;;
            merge_group)                      range="${MQ_BASE}..HEAD"; level="merge queue: only the commits it adds" ;;
            push)                             range="HEAD";             level="push: the whole history of this branch" ;;
            *)                                range="--all";            level="every ref of the repository" ;;
          esac
          case "$range" in ..HEAD) range="HEAD"; level="no base commit given: the whole history of this branch" ;; esac
          echo "level: $level"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: scan
        env:
          RANGE: ${{ steps.scope.outputs.range }}
        run: |
          if [ -f .gitleaks.toml ]; then
            echo "using this repository's .gitleaks.toml"
            conf="--config .gitleaks.toml"
          else
            echo "no .gitleaks.toml: default rules"
            conf=""
          fi
          ./gitleaks git $conf --log-opts="$RANGE" --redact --no-banner --exit-code 1 .
